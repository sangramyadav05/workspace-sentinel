[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-sentinel"
version = "0.1.0"
description = "A workspace-restricted, approval-gated read-only CLI agent."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
workspace-sentinel = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "interface*", "memory*"]
namespaces = true
